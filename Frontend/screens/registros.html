<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registros</title>
  <link rel="stylesheet" href="/registros.css" />
</head>
<body>
  <div class="registro-table-container" id="registrosPage">
    <img src="/assets/espacio-seguro.png" alt="Logo UCC" class="logo">
    <h2>Registros de Usuarios</h2>

    <div class="tabla-responsive">
  <table class="registro-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Matrícula</th>
            <th>Tipo</th>
            <th>Licenciatura o Área</th>
            <th>Placa</th>
            <th>Marca</th>
            <th>Color</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="registrosBody"></tbody>
      </table>
    </div>


    <!-- ====== Visitantes (Nuevo y Temporal) ====== -->
<section class="contenedor-tabla" style="margin-top: 32px;">
  <h2 class="titulo-seccion">Visitantes</h2>

  <div class="tabla-responsive">
    <table class="registro-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre completo</th>
          <th>Tipo</th>
          <th>Placa</th>
          <th>Marca</th>
          <th>Color</th>
          <th>Evento (Horario)</th>
          <th>Persona recoge / Relación</th>
          <th>Fecha registro</th>
          <th class="col-acciones">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyVisitantes"></tbody>
    </table>
  </div>
</section>


    <button class="btn-rojo-mini" onclick="window.location.href='menu.html'">Volver</button>
  </div>
  <script src="/js/shared.js"></script>
<script src="/js/registros.js"></script>
</body>
</html>
