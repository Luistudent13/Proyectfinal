<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajones Disponibles</title>
  <link rel="stylesheet" href="/styles.css">
  
  <style>
    /* Estilos rápidos para el Grid (puedes moverlos a styles.css si prefieres) */
    .grid-cajones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .cajon {
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      border: 1px solid #ddd;
      cursor: pointer;
      background: #fff;
    }
    .disponible { background: #d4edda; color: #155724; }
    .ocupado { background: #f8d7da; color: #721c24; }
    .reservado { background: #fff3cd; color: #856404; }
    
    .btn-volver {
        display: block; margin: 20px auto; padding: 10px 20px;
        background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="page-container">
    <div class="header-zone" style="text-align: center; margin-top: 20px;">
      <img src="/assets/espacio-seguro.png" alt="Logo" width="100">
      <h2>Mapa de Cajones</h2>
      <p>Clic en un cajón para ver opciones.</p>
    </div>

    <div id="gridCajones" class="grid-cajones"></div>

    <button class="btn-volver" onclick="window.location.href='/screens/menu.html'">
      Volver al Menú
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="/js/shared.js"></script> 

  <script src="/js/cajones.js"></script>

</body>
</html>
