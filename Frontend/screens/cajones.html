<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta-name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajones Disponibles</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      background: #f2f5f9;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    /* CONTENEDOR GENERAL */
    .page-container {
      width: 95%;
      max-width: 1600px;
      margin: 40px auto;
    }

    .header-zone {
      text-align: center;
      margin-bottom: 25px;
    }

    .header-zone img {
      width: 110px;
      opacity: 0.9;
    }

    .header-zone h2 {
      font-size: 32px;
      margin: 10px 0 6px 0;
      font-weight: 700;
      color: #233347;
    }

    .header-zone p {
      color: #555;
      font-size: 17px;
    }

    /* GRID RESPONSIVE */
    .grid-cajones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 18px;
      margin-top: 20px;
      padding-bottom: 40px;
    }

    /* TARJETAS DE CAJÓN */
    .cajon {
      padding: 18px 10px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      background: #e8eef5;
      border: 1px solid #d0d8e2;
      cursor: pointer;
      transition: .18s;
      min-height: 120px;
    }

    .cajon:hover {
      transform: translateY(-5px);
      box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    }

    /* ESTADOS */
    .disponible { background: #bff7c5 !important; }
    .ocupado { background: #f8a3a3 !important; }
    .reservado { background: #ffe08a !important; }
    .discapacitado { border: 3px solid #005eff; }

    /* BOTÓN VOLVER */
    .btn-volver {
      margin-top: 35px;
      background: #2d7df6;
      color: white;
      padding: 12px 26px;
      font-size: 17px;
      border-radius: 8px;
      display: block;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      cursor: pointer;
      transition: .2s;
      border: none;
    }

    .btn-volver:hover {
      background: #1a5fd0;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="page-container">

    <div class="header-zone">
      <img src="/assets/espacio-seguro.png" />
      <h2>Cajones (50 espacios)</h2>
      <p>Da clic para reservar, ocupar o liberar un espacio.</p>
    </div>

    <div id="gridCajones" class="grid-cajones"></div>

    <button class="btn-volver" onclick="window.location.href='/screens/menu.html'">
      Volver al Menú
    </button>

  </div>

  <!-- SWEETALERT2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="/js/shared.js"></script>
  <script src="/js/cajones.js"></script>
</body>
</html>
