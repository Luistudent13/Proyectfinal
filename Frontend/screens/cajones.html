<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajones Disponibles</title>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="/styles.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ===== Contenedor principal ===== */
    .contenedor-principal {
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 20px #0001;
    }

    /* ===== Títulos ===== */
    .titulo {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      margin-bottom: 20px;
      color: #444;
    }

    /* ===== Grid ===== */
    .grid-cajones {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 15px;
      padding: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* ===== Tarjeta de cajón ===== */
    .cajon {
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
      background: #f2f2f2;
      border: 2px solid transparent;
    }

    .cajon:hover {
      transform: scale(1.05);
    }

    .disponible {
      background: #b5ffb5 !important;
    }

    .ocupado {
      background: #ffb5b5 !important;
      cursor: not-allowed;
    }

    .reservado {
      background: #ffe7a3 !important;
    }

    .discapacitado {
      border: 3px solid #005eff !important;
    }

    /* ===== Botón volver ===== */
    .btn-volver {
      display: block;
      margin: 25px auto 0;
      padding: 12px 25px;
      background: #0a84ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .btn-volver:hover {
      background: #006fd6;
      transform: scale(1.03);
    }

    /* Ancho extra para los modales de SweetAlert */
    .swal-wide {
      width: 380px !important;
    }
  </style>
</head>

<body>

  <div class="contenedor-principal">

    <div class="titulo">
      <img src="/assets/espacio-seguro.png" class="logo" style="width:120px; margin-bottom:-10px" />
      <h2>Cajones (50 espacios)</h2>
    </div>

    <p class="subtitulo">
      Da clic para <strong>reservar</strong>, <strong>ocupar</strong> o <strong>liberar</strong>.
    </p>

    <!-- GRID -->
    <div id="gridCajones" class="grid-cajones"></div>

    <button class="btn-volver" onclick="window.location.href='/screens/menu.html'">
      Volver al Menú
    </button>

  </div>

  <!-- Scripts -->
  <script src="/js/shared.js"></script>
  <script src="/js/cajones.js"></script>

</body>
</html>
