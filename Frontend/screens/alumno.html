<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Alumno</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
  <link rel="stylesheet" href="../chatbot.css">
</head>
<body>
  <div class="alumno-form-container" id="alumnoPage">
    <img src="/assets/espacio-seguro.png" alt="Logo UCC" class="logo">
    <div class="form-box">
      <form id="formAlumno" action="javascript:void(0)">
        <fieldset>
          <legend>Datos del alumno</legend>
          <div class="row">
            <div class="form-group">
              <label for="nombre">Nombre(s):</label>
              <input type="text" id="nombre" required />
            </div>
            <div class="form-group">
              <label for="apellidos">Apellidos:</label>
              <input type="text" id="apellidos" required />
            </div>
          </div>
          <div class="form-group">
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" maxlength="9" required />
          </div>
          <div class="form-group">
            <label for="licenciatura">Licenciatura:</label>
            <input type="text" id="licenciatura" class="awesomplete" autocomplete="off" required />
          </div>
        </fieldset>

        <fieldset>
          <legend>Datos del vehículo</legend>
          <div class="form-group">
            <label for="placaAlumno">Número de Placa:</label>
            <input type="text" id="placaAlumno" maxlength="9" placeholder="ABC-123-X" required>

          </div>
          <div class="form-group">
            <label for="color">Color del vehículo:</label>
            <input type="text" id="color" required />
          </div>
          <div class="form-group">
            <label for="marca">Marca del vehículo:</label><input type="text" id="marca" class="awesomplete" autocomplete="off" required />

          </div>
        </fieldset>

        <div class="form-buttons">
          <button type="submit" class="btn-verde">Enviar</button>
          <button type="button" class="btn-rojo" onclick="window.location.href='/screens/menu.html'">Cancelar</button>
        </div>
        <p id="msgAlumno"></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/shared.js"></script>
<script src="/js/sharedForms.js"></script>
<script src="/js/alumno.js"></script>
</body>
</html>
