<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Usuario</title>

  <!-- primero Awesomplete -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.css">
<!-- después tu CSS -->
<link rel="stylesheet" href="/editar.css">

<!-- el JS de Awesomplete puede quedarse donde lo tienes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>

</head>

<body>
  <div class="formulario-container">
    <h2>Editar Usuario</h2>
    <form id="formEditar" method="post">
      <div class="form-group">
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" required />
</div>

<div class="form-group">
  <label for="apellidos">Apellidos</label>
  <input type="text" id="apellidos" name="apellidos" required />
</div>
      <div class="form-group">
  <label for="matricula" id="labelMatricula">Matrícula</label>
<input type="text" id="matricula" name="matricula" placeholder="Matrícula" autocomplete="off" required />
</div>

      <div id="grupoLic" class="form-group">
        <label for="licenciatura">Licenciatura (si aplica)</label>
        <input id="licenciatura" name="licenciatura" type="text" />
      </div>

      <div id="grupoArea" class="form-group">
        <label for="areaEmpleado">Área de empleado (si aplica)</label>
        <input id="areaEmpleado" name="areaEmpleado" type="text" />
      </div>

      <div class="form-group">
  <label for="placaEditar">Placa del vehículo</label>
<input type="text" id="placaEditar" maxlength="9" placeholder="ABC-123-X" autocomplete="off" required>


</div>

<div class="form-group">
  <label for="color">Color del vehículo</label>
  <input type="text" id="color" name="color" required />
</div>

      <div class="form-group" id="grupoMarca">
  <label for="marca">Marca del vehículo</label>
<input type="text" id="marca" name="marca" placeholder="Marca del vehículo" autocomplete="off" required />
</div>



      <button type="submit">Guardar cambios</button>
      <button type="button" class="btn-regresar" onclick="location.href='/screens/registros.html'">Cancelar</button>
    </form>
    <div id="mensaje" class="mensaje"></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/shared.js" defer></script>
<script src="/js/sharedForms.js" defer></script>
<script src="/js/editar.js" defer></script>
</body>
</html>
