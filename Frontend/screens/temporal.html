<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Visitante Temporal</title>
  <!-- MISMOS ESTILOS DEL PROYECTO -->
  <link rel="stylesheet" href="/styles.css" />
  <!-- Awesomplete (autocompletado de marcas igual que visitante) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
  <link rel="stylesheet" href="../chatbot.css">
</head>

<body>
  <div class="contenedor-principal">
    <div class="temporal-form-container">
      <img src="/assets/espacio-seguro.png" alt="Logo" class="logo">

      <form id="formTemporal" action="javascript:void(0)">
        <div class="form-box">
          <!-- SECCIÓN: Datos del visitante -->
          <fieldset>
            <legend>Registro de Visitante Temporal</legend>

            <div class="row">
              <div class="form-group">
                <label for="nombreTemporal">Nombre del visitante</label>
                <input type="text" id="nombreTemporal" required />
              </div>

              <div class="form-group">
                <label for="apellidosTemporal">Apellidos</label>
                <input type="text" id="apellidosTemporal" required />
              </div>
            </div>

            <div class="form-group">
              <label for="personaRecoge">¿A quién recoge?</label>
              <input type="text" id="personaRecoge" required />
            </div>

            <div class="form-group">
              <label for="relacionEstudiante">Relación con el estudiante</label>
              <input type="text" id="relacionEstudiante" required />
            </div>
          </fieldset>

          <!-- SECCIÓN: Datos del vehículo -->
          <fieldset>
            <legend>Datos del vehículo</legend>

            <div class="row">
              <div class="form-group">
                <label for="placaTemporal">Placa</label>
                <input type="text" id="placaTemporal" maxlength="9" placeholder="ABC-123-X" autocomplete="off" required />
              </div>

              <div class="form-group">
                <label for="colorTemporal">Color del vehículo</label>
                <input type="text" id="colorTemporal" required />
              </div>
            </div>

            <div class="form-group">
              <label for="marcaTemporal">Marca</label>
              <input type="text" id="marcaTemporal" class="awesomplete" autocomplete="off" required />
            </div>
          </fieldset>

          <!-- BOTONES -->
          <div class="form-buttons">
            <button type="submit" class="btn-verde">Registrar entrada</button>
            <button type="button" class="btn-rojo" onclick="window.location.href='menu.html'">Cancelar</button>

          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Librerías y lógica (igual que en visitante) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/sharedForms.js"></script>
  <script src="/js/temporal.js"></script>
</body>

</html>
