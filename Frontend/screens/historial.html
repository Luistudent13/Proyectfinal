<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Accesos</title>
  <link rel="stylesheet" href="/historial.css">
</head>

<body>
  <div class="historial-container">
    <img src="/assets/espacio-seguro.png" alt="Logo UCC" class="logo">
    <h2>Historial de Accesos</h2>

    <!-- Filtros por fecha -->
    <div class="filtros-container">
      <label for="filtroFecha">Filtrar por fecha:</label>
      <input type="date" id="filtroFecha">
      <button type="button" class="btn-azul" id="btnFiltrarFecha">Filtrar</button>
      <button type="button" class="btn-gris" id="btnMostrarTodos">Mostrar todos</button>
    </div>

    <div id="tablaHistorialContainer" class="tabla-container">
      <table id="tablaHistorial">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Placa</th>
            <th>Fecha Acceso</th>
            <th>Hora Entrada</th>
            <th>Hora Salida</th>
          </tr>
        </thead>
        <tbody id="tablaHistorialBody"></tbody>
      </table>

      <p id="contadorLugares" class="disponibles-texto"></p>
    </div>

    <button class="btn-azul" onclick="window.location.href='/screens/menu.html'">
      Volver al Menú
    </button>
  </div>

  <!-- Librería de alertas -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Utilidades compartidas: requireAuth, apiFetch, etc. -->
  <script src="/js/shared.js"></script>

  <!-- Validaciones y helpers compartidos -->
  <script src="/js/sharedForms.js"></script>

  <!-- Lógica específica de la pantalla de historial -->
  <script src="/js/historial.js"></script>
</body>

</html>
